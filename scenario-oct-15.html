<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oct 15 Scenario</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202020;background:#fff}
body{margin:0;padding:24px}
main{max-width:980px;margin:0 auto}
h1{font-size:1.4rem;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border:1px solid #d7d7d7;border-radius:8px;padding:16px}
h2{font-size:1rem;margin:0 0 10px}
.answer{font-size:4rem;font-weight:700;line-height:.9;margin:0 0 12px;letter-spacing:.06em}
.up{color:#ef4b43}.down{color:#50a858}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dt{color:#626262}dd{margin:0;font-weight:700}
ul{margin:12px 0 0;padding-left:18px}
.error{color:#b00020;font-weight:700}
@media (max-width:720px){.grid{grid-template-columns:1fr}.answer{font-size:3rem}}
</style>
</head>
<body>
<main>
  <h1>Current vs Oct 15 Scenario</h1>
  <section class="grid" id="grid"></section>
</main>
<script>
const NAMES = { gasoline: "Gasolina", diesel: "Diesel", kerosene: "Kerosene" };
const peso = n => "₱" + Math.abs(n).toFixed(2);
const sign = n => (n > 0 ? "+" : n < 0 ? "−" : "");

function answer(data) {
  return data.current[data.headlineFuel] > 0 ? "OO" : "HINDI";
}

function card(title, data) {
  const head = data.current[data.headlineFuel];
  const section = document.createElement("section");
  section.className = "card";
  section.innerHTML = `
    <h2>${title}</h2>
    <p class="answer ${head > 0 ? "up" : "down"}">${answer(data)}</p>
    <dl>
      <dt>Updated</dt><dd>${data.updated}</dd>
      <dt>Week</dt><dd>${data.week}</dd>
      <dt>Headline fuel</dt><dd>${NAMES[data.headlineFuel]}</dd>
      <dt>Forecast</dt><dd>${data.forecast ? data.forecast.date : "Wala"}</dd>
    </dl>
    <ul>
      ${Object.entries(data.current).map(([fuel, value]) => `<li>${NAMES[fuel]}: ${sign(value)}${peso(value)}</li>`).join("")}
    </ul>
  `;
  return section;
}

Promise.all([
  fetch("data.json", { cache: "no-store" }).then(r => r.json()),
  fetch("data-oct-15.json", { cache: "no-store" }).then(r => r.json()),
]).then(([today, oct15]) => {
  const grid = document.getElementById("grid");
  grid.append(card("Today", today), card("Simulated Oct 15", oct15));
}).catch(error => {
  document.getElementById("grid").innerHTML = `<p class="error">${error.message}</p>`;
});
</script>
</body>
</html>
