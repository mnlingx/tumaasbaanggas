name: Update fuel data

on:
  schedule:
    - cron: "12 0 * * 0"   # Monday 8:12AM
    - cron: "12 16 * * 1"    # Tuesday 12:12AM
    - cron: "12 12 * * 5"   # Friday 8:12PM
  workflow_dispatch:       # para mapatakbo mo ito nang mano-mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Suriin ang API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY" || (echo "::error::Missing GitHub Secret OPENAI_API_KEY" && exit 1)
      - name: Kunin ang bagong datos
        run: node update.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: I-save kung may nagbago
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update fuel data" && git push)
